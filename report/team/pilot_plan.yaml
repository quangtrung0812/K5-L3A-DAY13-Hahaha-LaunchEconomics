    spillover_risk: "Nhân viên trong cùng depot có thể trao đổi hoặc nhìn màn hình gợi ý của nhau; giảm thiểu bằng phân quyền theo staff_id cá nhân và ghi log staff_id cho mọi lần mở trợ lý"
    predeclared: "Đã chốt trước chỉ số chính, cỡ mẫu n=859 hiệu dụng/nhóm (power ~0,64 ở mức 5 điểm), 3 luật dừng và ngày chốt 2027-01-05 trước khi chạy bước 0.10"
  stop_rules:
    - "NẾU tỉ lệ mo_lai_trong_7_ngay của nhóm trợ lý cao hơn nhóm đối chứng >= 2,0 điểm phần trăm hoặc vượt 6,0%, hoặc có >= 1 ca hoàn tiền trùng sổ cái TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt feature-flag trợ lý trong tối đa 30 phút KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công vượt 8.000 đ (tính cả giờ nhân viên đo thật) TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về chỉ noi_dia và giới hạn tối đa 2 lần chạy KHÔNG THÌ không được mở hoặc duy trì chạy cho hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý (sua + bo trên số ca xem lại) vượt 40% TRONG 1 tuần liên tiếp THÌ Trưởng nhóm CSKH phỏng vấn tối thiểu 5 nhân viên trong 3 ngày để sửa luồng gợi ý KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
  interim_looks: "chỉ kiểm tra chỉ số an toàn (mở lại 7 ngày, hoàn trùng sổ cái, chi phí mỗi việc thành công và tỉ lệ bỏ qua gợi ý; không dừng sớm vì hiệu quả chỉ số chính)"
  rollback: "Giám đốc vận hành tắt feature-flag toàn hệ thống trong tối đa 30 phút; toàn bộ yêu cầu lập tức chuyển về quy trình nhân viên tự làm (chuẩn 6 phút = 12.000 đ/yêu cầu)"
  decision_date: "2027-01-05"
  simulated_inputs:
